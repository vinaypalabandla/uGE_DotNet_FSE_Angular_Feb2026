<!DOCTYPE html>
<html>
<head>
    <title>Live Form Validation</title>
</head>
<body>

<h2>Registration Form</h2>
<fieldset>
    <legend>Registration Form</legend>

<label>Name : </label>
<input type="text" id="name" onchange="validateName()"> <!--function name validateName-->
<span id="nameMsg"></span>
<br><br>

<label>Email: </label>
<input type="text" id="email" onchange="validateEmail()">
<span id="emailMsg"></span> <!--validation message to dispaly amd  not brak line-->
<br><br>

<label>Age: </label>
<input type="number" id="age" onchange="validateAge()">
<span id="ageMsg"></span> 
<br><br>

<button onclick="submitForm()">Subbmit</button>
<p id="successMsg"></p>
</fieldset>

<script>
function validateName() {
    let name = document.getElementById("name").value;
    if (name.trim() === "") { // remove spaces  check empty or not===  
        document.getElementById("nameMsg").innerHTML = "Name cannot be empty"; //inerhtml is  property and get contain inside in html

        return false;
    } else {
        document.getElementById("nameMsg").innerHTML = ""; //inerhtml is  property and get contain inside in html
        return true;
    }
}

function validateEmail() {
    let email = document.getElementById("email").value;
    if (!email.includes("@")) { //this method checks whether a string is contains or not somenthig
        document.getElementById("emailMsg").innerHTML = "Email must  be contain @";
        return false;
    } else {
        document.getElementById("emailMsg").innerHTML = "";
        return true;
    }
}

function validateAge() {
    let age = document.getElementById("age").value;
    if (age <= 18) {
        document.getElementById("ageMsg").innerHTML = "Age must be greater than 18";
        return false;
    } else {
        document.getElementById("ageMsg").innerHTML = "";
        return true;
    }
}

function submitForm() {
    if (validateName() && validateEmail() && validateAge()) {
        let userData = {
            name: document.getElementById("name").value, //user text
            email: document.getElementById("email").value,
            age: document.getElementById("age").value
        };
                                  // user data is key and json.stringfy convert object to string here
        //sessionStorage stores only string
        sessionStorage.setItem("userData", JSON.stringify(userData));
        document.getElementById("successMsg").innerHTML = "Registration Successful!";
    } else {
        document.getElementById("successMsg").innerHTML = "Please fix errors before submitting.";
    }
}
</script>

</body>
</html>
