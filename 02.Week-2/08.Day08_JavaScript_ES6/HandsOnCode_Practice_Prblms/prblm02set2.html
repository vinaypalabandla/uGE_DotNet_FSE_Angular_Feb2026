<!DOCTYPE html>
<html>
<head>
    <title>Light Dark Mode</title>

    <style>
        body {
            transition: 0.3s;
        }

        .light {
            background-color: white;
            color: black;
        }

        .dark {
            background-color:black;
            color: white;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <button id="toggleBtn">Toggle Theme(Color Change)</button>

    <h2>My Blog</h2>
    <p>Iam creating simple blog website</p>

    <script>
        let toggleBtn = document.getElementById("toggleBtn");
        
        let savedTheme = localStorage.getItem("theme");

        if (savedTheme) {
            document.body.className = savedTheme;
        } else {
            document.body.className = "light";
        }
        toggleBtn.addEventListener("click", () => {
            let currentTheme = document.body.className;
            let newTheme = currentTheme === "light" ? "dark" : "light";

            document.body.className = newTheme; // use to get or set the class attribute of the body element to dynamically change
            localStorage.setItem("theme", newTheme);
        });
    </script>

</body>
</html>
