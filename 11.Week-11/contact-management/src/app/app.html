<div>
  <!-- Two way Binding -->
     <h2>Contact Management</h2>
   <input [(ngModel)] ="searchText" placeholder="Search by name or email"/>
   <table border = "2" cellpadding="8">
    <tr>
      <th>Name</th>
      <th>Email</th>
      <th>Phone</th>
      <th>Status</th>
      <th>Action</th>
    </tr>
    <!-- *ng using here-->
<tr *ngFor="let c of (contacts | search:searchText) | slice:0:showCount">
      <!-- interpolation using for here showing name and email -->
       <td>{{c.name | titlecase}}</td>
       <td>{{c.email | lowercase}}</td>
       <td>{{c.phone | phone}}</td>
       <!-- propeerty binding used here -->
        <td [ngClass]="c.status ? 'green' : 'red'">
          {{c.status |status }}
        </td>
        <!-- Event Binding used here -->
         <td>
          <button (click) ="buttonStatus(c)">Toggle</button>
         </td>
     </tr>
   </table>

   <br/>
   <button (click)="showMore()">Show More</button>
   <button (click)="showLess()">Show Less</button>
</div>
