<div class="container mt-4">
  <h2>{{isEdit ? 'Edit Contact' : 'Add Contact'}}</h2>

  <form (ngSubmit)="save()" class="card p-4 shadow">

    <div class="mb-3">
      <label>Name</label>
      <input type="text" [(ngModel)]="contact.name"
             name="name" class="form-control" required>
    </div>

    <div class="mb-3">
      <label>Email</label>
      <input type="email" [(ngModel)]="contact.email"
             name="email" class="form-control" required>
    </div>

    <div class="mb-3">
      <label>Phone</label>
      <input type="text" [(ngModel)]="contact.phone"
             name="phone" class="form-control" required>
    </div>

    <button class="btn btn-primary">
      {{isEdit ? 'Update' : 'Save'}}
    </button>

  </form>
</div>
