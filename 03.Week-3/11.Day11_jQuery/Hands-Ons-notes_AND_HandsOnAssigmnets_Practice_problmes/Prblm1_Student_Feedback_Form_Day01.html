<body>

        <br/><br/>

        Email:

        <br/><br/>

        Course Rating:

        comments:
        <br/>
        <textarea id="comments" rows="4" cols="20"></textarea>
        <br/><br/>

         <br/><br/>

        <script src="https://code.jquery.com/jquery-4.0.0.js"></script>

        <script>
            $(document).ready(function() {

                $("#subBtn").click(function() {
                    let name = $("#name").val();
                    let email = $("#email").val();
                    let rating = $("#rating").val();
                    let comments = $("#coomments").val();

                    if(name === "" || email === "") {
                        $("#outPut").text("Please Enter both Name and Email. "  + name + "!").css("color", "red");
                    }
                    else {

                        $("#outPut").text("Thank you for your feedBack, "  + name + "!").css("color", "green");
                            $("#name").val("");

</body>
