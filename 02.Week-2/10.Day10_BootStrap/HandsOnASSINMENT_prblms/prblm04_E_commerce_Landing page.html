<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E-Commerce Landing</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root {
  --bs-primary: #6f42c1;
}
.hero {
  background: linear-gradient(135deg, #6f42c1, #20c997);
  color: white;
  padding: 100px 20px;
  text-align: center;
}
</style>
</head>
<body>

<nav class="navbar navbar-dark bg-primary fixed-top">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">ShopEase</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
  </div>
</nav>

<div class="offcanvas offcanvas-end" id="offcanvasMenu">
  <div class="offcanvas-header">
    <h5>Menu</h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
  </div>
  <div class="offcanvas-body">
    <ul class="nav flex-column">
      <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
      <li class="nav-item"><a class="nav-link" href="#">Products</a></li>
      <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
    </ul>
  </div>
</div>

<section class="hero mt-5">
  <div class="container">
    <h1>Welcome to ShopEase</h1>
    <p>Best Deals on Electronics</p>
    <button class="btn btn-light">Shop Now</button>
  </div>
</section>

<!-- Carousel im using here -->
<div id="productCarousel" class="carousel slide container my-5" data-bs-ride="carousel">
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="#" class="d-block w-100" alt="">
    </div>
    <div class="carousel-item">
      <img src="#" class="d-block w-100" alt="">
    </div>
    
  </div>
  <button class="carousel-control-prev" type="button" data-bs-target="#productCarousel" data-bs-slide="prev">
    <span class="carousel-control-prev-icon"></span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#productCarousel" data-bs-slide="next">
    <span class="carousel-control-next-icon"></span>
  </button>
</div>

<div class="container my-5">
  <div class="row g-4">
    <div class="col-12 col-sm-6 col-lg-4 col-xl-3">
      <div class="card shadow">
        <img src="smartwatchimg.jpg" class="card-img-top">
        <div class="card-body text-center">
          <h5>Product 1</h5>
          <button class="btn btn-primary">Buy Now</button>
        </div>
      </div>
    </div>
    <div class="col-12 col-sm-6 col-lg-4 col-xl-3">
      <div class="card shadow">
        <img src="headphonesimg.jpg" class="card-img-top">
        <div class="card-body text-center">
          <h5>Product 2</h5>
          <button class="btn btn-primary">Buy Now</button>
        </div>
      </div>
    </div>
    <div class="col-12 col-sm-6 col-lg-4 col-xl-3">
      <div class="card shadow">
        <img src="smartphimg.jpg" class="card-img-top">
        <div class="card-body text-center">
          <h5>Product 3</h5>
          <button class="btn btn-primary">Buy Now</button>
        </div>
      </div>
    </div>
    <div class="col-12 col-sm-6 col-lg-4 col-xl-3">
      <div class="card shadow">
        <img src="laptopimg.jpg" class="card-img-top">
        <div class="card-body text-center">
          <h5>Product 4</h5>
          <button class="btn btn-primary">Buy Now</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="bg-light py-5">
  <div class="container text-center">
    <h4>Subscribe to Newsletter</h4>
    <form class="row g-2 justify-content-center">
      <div class="col-12 col-md-6">
        <input type="email" class="form-control" placeholder="Enter email">
      </div>
      <div class="col-12 col-md-2">
        <button class="btn btn-primary w-100">Subscribe</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
